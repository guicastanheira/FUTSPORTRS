<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Sistema</title>
  <link rel="stylesheet" href="cadastro.css">
</head>

<body class="cadastro-page">
  <div class="container">
    <h1>Cadastro</h1>
    <form>
      <label for="nome">Nome</label>
      <input type="text" id="nome" placeholder="Digite seu nome completo" required>

      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="Digite seu e-mail" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="Digite sua senha" required>

      <label for="telefone">Telefone</label>
      <input type="tel" id="telefone" placeholder="(XX) XXXXX-XXXX" required>

      <label for="endereco">Endereço</label>
      <input type="text" id="endereco" placeholder="Rua, número" required>

      <label for="cidade">Cidade</label>
      <input type="text" id="cidade" placeholder="Digite sua cidade" required>

      <label for="uf">UF</label>
      <input type="text" id="uf" placeholder="Seu Estado" required>

      <button type="submit">Cadastrar</button>

      <p class="link">
        Já tem conta?
        <a href="login.html">Fazer login</a>
      </p>
    </form>

    <nav>
      <ul>
        <p2><a href="inicio.html">Inicio</a></p2>
      </ul>
    </nav>


  </div>
</body>

</html>
