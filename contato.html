<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="contato.css">
</head>

<body>

    <header>
        <h1>Fale Conosco</h1>
        <p>Envie sua mensagem preenchendo o formulário abaixo</p>
    </header>

    <div class="container">

        <div class="form-contato">
            <h2>Contato</h2>

            <form>
                <label for="nome">Nome</label>
                <input type="text" id="nome" placeholder="Seu nome" required>

                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="Seu e-mail" required>

                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" placeholder="Digite sua mensagem" required></textarea>

                <button type="submit">Enviar</button>
            </form>
        </div>
       

        <div class="info-contato">
            <h2>Informações</h2>
            <p><strong>Email:</strong> contato@exemplo.com</p>
            <p><strong>Telefone:</strong> (51) 99999-0000</p>
            <p><strong>Endereço:</strong> Rua Exemplo, 123 - Porto Alegre</p>
        </div>

    </div>

    <nav><ul><p><a href="inicio.html">Inicio</a></p></ul></nav>

    <footer>© 2025 - FUTSPORTRS</footer>

</body>

</html>
